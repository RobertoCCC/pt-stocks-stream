# Render Blueprint for pt-stocks-stream.
#
# Render's free tier no longer supports background workers, so we ship the
# `allinone` binary (poller + wsserver collocated in one process, both
# connected through the same Upstash Redis channel). The architecture is
# identical to the split-services shape demonstrated by docker-compose.yml —
# the poller still publishes to Redis and the hub still subscribes from
# Redis — but everything runs in a single OS process.
#
# To scale beyond one machine, swap this `dockerCommand` for
# `wsserver -addr=:$PORT …` and add a `type: worker` service running
# `poller -sink=redis …` (the binaries are baked into the same image). That
# requires a paid Render plan because the free tier has no worker option.
#
# After importing this blueprint:
#   1. Set REDIS_URL in the env group (Upstash rediss://… works on the free
#      tier and gives you TLS for free).
#   2. Set WS_ALLOWED_ORIGINS to the comma-separated Vercel host(s) of
#      pt-stocks-stream-web.
#
# Frankfurt region matches the rest of the portfolio so latency to the
# Lisbon stock exchange stays predictable.

services:
  - type: web
    name: pt-stocks-stream
    region: frankfurt
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: allinone -addr=:$PORT -redis-url=$REDIS_URL -log-format=json -allowed-origins=$WS_ALLOWED_ORIGINS -source=synthetic -interval=15s -timeout=8s
    healthCheckPath: /healthz
    envVars:
      - fromGroup: pt-stocks-stream
      - key: WS_ALLOWED_ORIGINS
        sync: false # set in dashboard (csv of frontend hosts)

envVarGroups:
  - name: pt-stocks-stream
    envVars:
      - key: REDIS_URL
        sync: false # set in dashboard (Upstash rediss://… URL)
